<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:#05113e;color:#f6f3ec;font-family:Poppins,sans-serif}
.card{position:absolute;inset:14px;border-radius:22px;background:linear-gradient(160deg,#1d2b50,#061b30 60%);box-shadow:0 18px 40px rgba(0,0,0,.45);border:1px solid rgba(252,215,123,.55)}
.card::after{content:"";position:absolute;inset:8px;border-radius:15px;border:1px solid rgba(252,215,123,.22)}
.idx{position:absolute;top:22px;left:22px;text-align:center;color:#fcd77b;font:800 26px/1 Montserrat}
.idx img{display:block;width:22px;margin:6px auto 0}
.idx.b{top:auto;left:auto;bottom:22px;right:22px;transform:rotate(180deg)}
.face{position:relative;padding:58px 44px 0;text-align:center}
.logo{width:160px;display:block;margin:0 auto 20px}
.photo{width:132px;height:132px;margin:0 auto 18px;border-radius:50%;background:#05113e;display:grid;place-items:center;font:700 40px Montserrat;color:#fcd77b;box-shadow:0 0 0 2px #fcd77b,0 0 0 7px #061b30,0 0 0 8px rgba(252,215,123,.35)}
h1{font:700 28px/1.1 Montserrat}
.role{margin-top:6px;font-size:15px;color:#c8cfdd}
.co{margin-top:3px;font-size:13px;color:#e3b865}
.save{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;margin-top:22px;border-radius:27px;background:linear-gradient(180deg,#fcd77b,#e3b865);color:#05113e;font:700 17px Montserrat}
.save svg{width:21px;height:21px;stroke:#05113e;fill:none;stroke-width:1.8}
.dl{display:block;margin-top:9px;font-size:13px;color:#c8cfdd;text-decoration:underline;text-underline-offset:3px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.acts div{height:70px;border-radius:14px;border:1px solid rgba(252,215,123,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 12px Montserrat;color:#f6f3ec}
.acts svg{width:22px;height:22px;stroke:#fcd77b;fill:none;stroke-width:1.5}
</style></head><body>
