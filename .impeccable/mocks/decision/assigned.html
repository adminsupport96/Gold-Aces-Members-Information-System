<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:#061b30;color:#f6f3ec;font-family:Poppins,sans-serif}
.sheet{position:absolute;inset:10px;border:1px solid rgba(227,184,101,.45);outline:1px solid rgba(227,184,101,.18);outline-offset:-5px}
.micro{position:absolute;left:0;right:0;top:-5px;text-align:center;font:600 7px/10px Montserrat;letter-spacing:.32em;color:#e3b865}
.micro span{background:#061b30;padding:0 8px}
.wrap{position:relative;padding:34px 26px 0;text-align:center}
.logo{width:178px;display:block;margin:0 auto 22px}
.save{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:6px;background:#ffc619;color:#061b30;font:700 18px Montserrat;letter-spacing:.01em}
.save svg{width:22px;height:22px;stroke:#061b30;fill:none;stroke-width:1.8}
.dl{display:inline-block;margin-top:10px;font-size:13px;color:#c8cfdd;text-decoration:underline;text-underline-offset:3px}
.seal{position:relative;width:212px;height:212px;margin:14px auto 6px}
.seal svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:#e3b865;stroke-width:.45}
.photo{position:absolute;inset:44px;border-radius:50%;background:#1d2b50;display:grid;place-items:center;font:600 40px Montserrat;color:#fcd77b;box-shadow:0 0 0 3px #061b30,0 0 0 4px rgba(227,184,101,.7)}
h1{font:700 30px/1.1 Montserrat;letter-spacing:-.01em}
.role{margin-top:6px;font-size:15px;color:#c8cfdd}
.co{margin-top:4px;font:600 12px Montserrat;letter-spacing:.16em;text-transform:uppercase;color:#e3b865}
.rows{margin:22px 0 0;padding:0;list-style:none;text-align:left}
.rows li{display:flex;align-items:center;gap:14px;height:58px;border-top:1px solid rgba(227,184,101,.28)}
.rows li:last-child{border-bottom:1px solid rgba(227,184,101,.28)}
.rows svg{width:22px;height:22px;stroke:#e3b865;fill:none;stroke-width:1.5;flex:none}
.rows .k{font:600 11px Montserrat;letter-spacing:.14em;text-transform:uppercase;color:#9aa6bd;width:66px}
.rows .v{flex:1;font-size:16px;font-variant-numeric:tabular-nums lining-nums}
.rows .chev{width:18px;height:18px;stroke:#9aa6bd}
</style></head><body>
